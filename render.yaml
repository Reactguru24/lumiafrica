# Optional: deploy ai-fitting-tool from monorepo root (backend uses Railway, frontend uses Netlify).
services:
  - type: web
    name: lumi-ai-fitting
    runtime: docker
    dockerfilePath: ai-fitting-tool/Dockerfile
    dockerContext: ai-fitting-tool
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 80
      - key: ALLOWED_ORIGINS
        value: https://lumiafricca.netlify.app,http://localhost:3000
      - key: BACKEND_API_URL
        value: https://dazzling-smile-production-1014.up.railway.app
