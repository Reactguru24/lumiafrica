# Monorepo: frontend lives in frontend/ — Netlify must build from here.
# Redeploy trigger: 2026-07-04 (ML deployed + AI fitting button)
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[context.production.environment]
  NEXT_PUBLIC_API_URL = "https://dazzling-smile-production-1014.up.railway.app"
  ML_API_URL = "https://ai-fitting-production.up.railway.app"

# Proxy API through Netlify (same-origin) — avoids CORS to Railway
[[redirects]]
  from = "/api-proxy/*"
  to = "https://dazzling-smile-production-1014.up.railway.app/:splat"
  status = 200
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
